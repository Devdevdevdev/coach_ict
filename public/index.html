<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>COACH ICT</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="app">
      <header class="hero">
        <div class="hero-top">
          <h1 id="appTitle">COACH ICT</h1>
          <div class="hero-controls">
            <button id="accessScreenButton" class="access-toggle" type="button">Accès</button>
            <button id="langToggle" class="lang-toggle" type="button" aria-label="Switch language">FR</button>
          </div>
        </div>
        <p id="appSubtitle">Mon coach ICT/SMC: analyse multi-timeframe et points d'entrée précis.</p>
      </header>
      <section id="onboardingView" class="onboarding">
        <section class="panel access-card">
          <h2 id="accessTitle">Accès utilisateur</h2>
          <p id="accessSubtle" class="subtle">Ces informations restent séparées du chat et stockées localement.</p>
          <form id="onboardingForm" class="composer">
            <label>
              <span id="kimiLabel">Clé API Kimi</span>
              <input id="onboardingKimiApiKey" type="password" placeholder="sk-..." autocomplete="off" />
            </label>
            <p id="accessHint" class="hint">Aucune clé n'est commitée. BYOK obligatoire pour chaque utilisateur.</p>
            <p id="onboardingError" class="hint error-text hidden"></p>
            <button id="accessContinueButton" type="submit">Valider les accès</button>
          </form>
        </section>
      </section>

      <section id="chatView" class="chat-view hidden">
        <section class="panel chat chat-full">
          <h2 id="assistantTitle">Mon COACH ICT</h2>
          <section class="coach-launch">
            <label class="symbol-picker">
              <span id="symbolSelectLabel">Paire à analyser</span>
              <select id="symbolSelect">
                <option value="XAUUSD">XAUUSD</option>
                <option value="XAGUSD">XAGUSD</option>
                <option value="EURUSD">EURUSD</option>
                <option value="GBPUSD">GBPUSD</option>
                <option value="USDJPY">USDJPY</option>
              </select>
            </label>
            <button id="runCoachButton" type="button">Lancer Coach IA</button>
          </section>
          <div id="messages" class="messages" aria-live="polite"></div>
        </section>
      </section>
    </main>

    <script src="/app.js" type="module"></script>
  </body>
</html>
